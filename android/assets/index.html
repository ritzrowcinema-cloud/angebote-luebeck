<style>
/* Layout: Handy zuerst – kompakter Wochenkopf, wischbare Karussells (Top-Rabatte, Fleisch, Getränke), darunter Liste mit Foto links und klebender Filterleiste */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#18202b; --muted:#5f6874; --line:#e1e4de; --chip:#e8ebe5;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --surface:#181e26; --ink:#eef1f4; --muted:#9aa4b0; --line:#262e38; --chip:#212833;
  --tag:#ffd526; --tag-ink:#141920; --save:#ff4d40; --save-ink:#ffffff; --accent:#82b3ff; --photo:#ffffff;
  --hero:#181e26; --hero-ink:#ffffff; --hero-muted:#a9b2bd; --good:#4fd18b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#181e26; --ink:#eef1f4; --muted:#9aa4b0; --line:#262e38; --chip:#212833;
  --tag:#ffd526; --tag-ink:#141920; --save:#ff4d40; --save-ink:#ffffff; --accent:#82b3ff; --photo:#ffffff;
  --hero:#181e26; --hero-ink:#ffffff; --hero-muted:#a9b2bd; --good:#4fd18b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopf */
.hero{background:var(--hero);color:var(--hero-ink)}
.hero .wrap{padding-block:20px 18px;display:grid;gap:10px}
.week{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--hero-muted)}
.kw{background:var(--tag);color:var(--tag-ink);font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.02em;padding:1px 8px;border-radius:5px}

.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--hero-muted)}
.stats b{color:var(--hero-ink);font-size:18px;font-family:var(--f-display);font-weight:700;margin-right:3px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--tag);color:var(--tag-ink);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.35;font-weight:600}
.alert svg{flex:0 0 20px;margin-top:1px}

/* Abschnitte */
main{display:grid;gap:26px;padding-block:20px 40px}
section{display:grid;gap:10px;min-width:0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* Karussell */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-bottom:4px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.tile{flex:0 0 152px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-rows:auto 1fr;cursor:pointer;text-align:left;padding:0}
.tile .ph{height:132px}
.tile .body{padding:8px 10px 10px;display:grid;gap:3px;align-content:start}
.tile .nm{font-weight:600;font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}

/* Foto-Fläche */
.ph{position:relative;background:var(--photo);display:grid;place-items:center;overflow:hidden}
.ph img{max-width:92%;max-height:92%;object-fit:contain;display:block}
.ph.ic{background:var(--chip);color:var(--ink)}
.ph.ic svg{width:52px;height:52px}
.ph .f1{fill:var(--tag)} .ph .f2{fill:var(--surface)} .ph .f3{fill:var(--save)} .ph .f4{fill:var(--accent)}
.badge{position:absolute;top:6px;left:6px;background:var(--save);color:var(--save-ink);font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px;font-variant-numeric:tabular-nums}

/* Markt-Zeile */
.store{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:2px}
.p{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.1;background:var(--tag);color:var(--tag-ink);padding:0 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.old{font-size:13px;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.unit{font-size:13px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}

/* Filterleiste */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input,.search select{font:inherit;font-size:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;height:42px;padding:0 12px;min-width:0}
.search input{flex:1 1 auto}
.search select{flex:0 0 auto;max-width:44%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 13px;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:13.5px;color:var(--muted)}

/* Liste */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-width:0}
.row .ph{width:96px;height:96px;border-radius:8px}
.row .ph .badge{font-size:14px;top:4px;left:4px;padding:3px 5px}
.row .body{min-width:0;display:grid;gap:2px;align-content:center}
.row .nm{font-weight:600;font-size:16px;line-height:1.22}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
@media (min-width:760px){ .list{grid-template-columns:1fr 1fr} .tile{flex-basis:170px} }

/* Prospekte */
.gal{display:grid;gap:16px}
.galrow{display:grid;gap:6px;min-width:0}
.galrow h3{display:flex;align-items:center;gap:6px;font-size:15px;margin:0}
.galrow .rail{gap:8px}
.thumb{flex:0 0 112px;scroll-snap-align:start;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0;cursor:zoom-in;overflow:hidden}
.thumb img{display:block;width:100%;aspect-ratio:3/5;object-fit:cover;object-position:top}

/* Märkte */
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px;font-size:14px}
.st b{display:flex;align-items:center;gap:6px;font-size:15px}
footer{font-size:13px;color:var(--muted);display:grid;gap:6px}
footer a{color:var(--accent)}

/* Großansicht */
.box{position:fixed;inset:0;z-index:20;background:rgba(8,10,14,.94);display:grid;grid-template-rows:auto 1fr;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px))}
.box[hidden]{display:none}
.box .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;font-size:14px}
.box .bar span:last-child{display:flex;gap:6px}
.box .bar button{background:#fff;color:#111;border:0;border-radius:999px;min-width:42px;height:38px;padding:0 14px;cursor:pointer;font-weight:600}
.box .view{overflow:auto;display:grid;place-items:start center;padding-top:8px;-webkit-overflow-scrolling:touch}
.box .view img{width:100%;max-width:900px;height:auto}
@media (prefers-reduced-motion:no-preference){.rail{scroll-behavior:smooth}}
.crop{display:block;max-width:92%;max-height:92%;background-repeat:no-repeat}
.ph .crop{border-radius:2px}
.offline{background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px}


/* Merken-Knopf */
.tile{position:relative}
.add{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);height:34px;min-width:34px;padding:0 10px;font-weight:700;font-size:14px;cursor:pointer}
.add svg{width:16px;height:16px}
.step{display:inline-flex;align-items:center;background:var(--tag);color:var(--tag-ink);border-radius:999px;height:34px}
.step button{border:0;background:none;color:inherit;width:34px;height:34px;font-size:20px;font-weight:700;cursor:pointer;line-height:1}
.step span{min-width:20px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.tile .act{padding:0 10px 10px}
.row{grid-template-columns:96px 1fr auto}
.row .act{align-self:end}
.row.inlist{border-color:var(--tag)}
.tile.inlist{border-color:var(--tag)}

/* Leiste unten */
main{padding-bottom:96px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.cartbar button{pointer-events:auto;width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);height:56px;padding:0 16px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.cartbar svg{width:22px;height:22px;flex:0 0 22px}
.cartbar .n{background:var(--tag);color:var(--tag-ink);border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px;padding:0 6px}
.cartbar .sum{margin-left:auto;font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}

/* Einkaufsliste */
.sheet{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sheet .top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.sheet .top h2{flex:1}
.close{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;padding:0 16px;font-weight:700;cursor:pointer}
.sheet .inner{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.addfree{position:relative}
.addfree form{display:flex;gap:8px}
.addfree input{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;height:46px;padding:0 12px}
.addfree .go{border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;padding:0 16px;height:46px;cursor:pointer}
.sugg{display:grid;gap:6px;margin-top:8px}
.sugg button{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;cursor:pointer}
.sugg .mini{width:44px;height:44px;border-radius:6px;background:var(--photo);display:grid;place-items:center;overflow:hidden}
.sugg .mini img{max-width:90%;max-height:90%}
.sugg .mini.ic{background:var(--chip)} .sugg .mini svg{width:26px;height:26px}
.sugg .t{font-size:15px;font-weight:600;line-height:1.2} .sugg .s{font-size:12.5px;color:var(--muted)}
.sugg .pp{font-family:var(--f-display);font-weight:800;font-size:18px}
.bill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.bill .tot{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bill .tot b{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.bill .sv{color:var(--good);font-weight:700;font-size:15px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:14.5px}
.bar .nm{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{display:block;height:10px;border-radius:999px;background:var(--chip);overflow:hidden}

.bar .v{font-weight:700;font-variant-numeric:tabular-nums;min-width:68px;text-align:right}
.grp{display:grid;gap:6px}
.grp h3{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-family:var(--f-display);font-size:22px;font-weight:800}
.grp h3 .gs{margin-left:auto;font-size:20px;font-variant-numeric:tabular-nums}
.grp .meta{font-size:13px;color:var(--muted);margin-top:-4px}
.li{display:grid;grid-template-columns:auto 52px 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.li .ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:none;cursor:pointer;display:grid;place-items:center;color:var(--bg)}
.li.done .ck{background:var(--ink);border-color:var(--ink)}
.li .ck svg{width:16px;height:16px}
.li .mini{width:52px;height:52px;border-radius:6px;background:var(--photo);display:grid;place-items:center;overflow:hidden}
.li .mini img{max-width:90%;max-height:90%}
.li .mini.ic{background:var(--chip)} .li .mini svg{width:30px;height:30px}
.li .t{font-weight:600;font-size:15px;line-height:1.2;min-width:0}
.li .s{font-size:12.5px;color:var(--muted)}
.li .r{display:grid;justify-items:end;gap:4px}
.li .lt{font-weight:800;font-variant-numeric:tabular-nums}
.li.done .t,.li.done .lt{text-decoration:line-through;color:var(--muted)}
.li .del{width:34px;height:34px;border:0;border-radius:999px;background:var(--chip);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.li .del svg{width:16px;height:16px}

@media (max-width:380px){.li{grid-template-columns:auto 44px 1fr auto auto;gap:8px}.li .mini{width:44px;height:44px}}
.li .step{height:30px}.li .step button{width:30px;height:30px;font-size:18px}
.gone{font-size:12px;color:var(--save);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;padding:0 14px;font-weight:600;cursor:pointer}

</style>

  }

  function tile(i){

  // Filter

  function renderChips(){

    cats.forEach(function(c){ cc.appendChild(chip(esc(c),state.cat===c,function(){state.cat=state.cat===c?'':c;update();})); });

  function renderList(){

    f.sort(function(a,b){ if(state.sort==='price') return a.price-b.price; if(state.sort==='store') return storeNames.indexOf(a.store)-storeNames.indexOf(b.store)||byPct(a,b); return byPct(a,b); });

  }
  function update(){ renderChips(); renderList(); try{localStorage.setItem('angebote-filter2',JSON.stringify({stores:Array.from(state.stores),sort:state.sort}));}catch(e){} }

  // Prospekte

  function find(k){for(var j=0;j<LIST.entries.length;j++) if(LIST.entries[j].k===k) return LIST.entries[j]; return null;}

  var sheet=document.getElementById('sheet');
  function openSheet(){ sheet.hidden=false; renderSheet(); if(location.hash!=='#liste'){ try{history.replaceState(null,'','#liste');}catch(e){ location.hash='liste'; } } }

  document.getElementById('openList').addEventListener('click',openSheet);

  window.addEventListener('hashchange',function(){ if(location.hash==='#liste') openSheet(); else if(!sheet.hidden) closeSheet(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!sheet.hidden&&box.hidden) closeSheet(); });
  function paintBar(){
    var n=0,t=0; LIST.entries.forEach(function(e){ var inf=entryInfo(e); n+= e.free?1:e.q; if(inf) t+=inf.price*e.q; });

  }
  // Speichern: im Konto (db), sonst im Browser
  var dbRef=null, writing=false, pending=false, timer=null, lastJson='';
  function sanitize(o){ var en=Array.isArray(o&&o.entries)?o.entries:[]; return {entries:en.filter(function(e){return e&&(typeof e.free==='string'||(typeof e.k==='string'&&e.snap&&typeof e.snap.price==='number'));}).map(function(e){ return e.free!=null?{free:String(e.free).slice(0,80),done:!!e.done}:{k:e.k,q:Math.max(1,Math.min(99,+e.q||1)),done:!!e.done,snap:{store:String(e.snap.store),name:String(e.snap.name),unit:String(e.snap.unit||''),price:+e.snap.price,old:e.snap.old==null?null:+e.snap.old}}; })}; }
  function local(save){ try{ if(save) localStorage.setItem('einkaufsliste',JSON.stringify(LIST)); else return JSON.parse(localStorage.getItem('einkaufsliste')||'null'); }catch(e){} return null; }
  function flush(){
    if(!dbRef) return; if(writing){pending=true;return;}
    var j=JSON.stringify(LIST); if(j===lastJson) return;
    writing=true; dbRef.set({entries:LIST.entries,updated:Date.now()}).then(function(){lastJson=j;}).catch(function(){ document.getElementById('syncNote').textContent='Speichern im Konto gerade nicht möglich – die Liste bleibt auf diesem Gerät erhalten.'; }).then(function(){ writing=false; if(pending){pending=false; flush();} });
  }
  function changed(){ paintBar(); paintActs(); if(!sheet.hidden) renderSheet(); local(true); clearTimeout(timer); timer=setTimeout(flush,700); }
  function applyRemote(data){ var s=sanitize(data); var j=JSON.stringify(s); if(j===JSON.stringify(LIST)) return; LIST=s; lastJson=j; paintBar(); paintActs(); if(!sheet.hidden) renderSheet(); local(true); }

};
