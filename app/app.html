<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Angebote Lübeck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f3f4f1; --surface:#fff; --ink:#18202b; --muted:#5f6874; --line:#e1e4de; --chip:#e8ebe5;
  --tag:#ffd526; --tag-ink:#18202b; --save:#d8261c; --accent:#1d5fc4; --good:#16794a; --good-bg:#e3f3ea; --heart:#e0245e;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --nav:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --surface:#181e26; --ink:#eef1f4; --muted:#9aa4b0; --line:#262e38; --chip:#212833;
  --save:#ff4d40; --accent:#82b3ff; --good:#4fd18b; --good-bg:#14301f; --heart:#ff5c8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#181e26; --ink:#eef1f4; --muted:#9aa4b0; --line:#262e38; --chip:#212833;
  --save:#ff4d40; --accent:#82b3ff; --good:#4fd18b; --good-bg:#14301f; --heart:#ff5c8a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;margin:0}
.top{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:10px}
.top h1{font-size:30px;font-weight:800;line-height:1.05}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sec{font-size:21px;font-weight:700;margin:22px 0 10px}
.muted{color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:1px;flex:none}

/* Prospekte */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .cv{position:relative;display:block;width:100%;aspect-ratio:3/4;border:0;padding:0;background:#fff;overflow:hidden}
.card .cv img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.card .cv .np{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:26px;font-weight:800;color:#fff}
.card .cv .pg{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.66);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:2px 8px}
.card .bar{height:5px}
.card .nm{padding:9px 10px 2px;font-weight:700;font-size:17px;display:flex;align-items:center}
.card .gl{padding:0 10px;color:var(--muted);font-size:13px}
.card .bt{display:grid;gap:6px;padding:10px}
.btn{border:0;border-radius:10px;padding:9px 8px;font-weight:700;font-size:14px;background:var(--chip);min-height:40px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4}

/* Bottom-Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{border:0;background:none;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--muted);position:relative}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--save);color:#fff;font-size:11px;line-height:18px;padding:0 5px}

/* Overlays */
.panel{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.phead{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;border-bottom:1px solid var(--line)}
.phead .row1{display:flex;align-items:center;gap:8px}
.phead h2{font-size:24px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.ib{border:0;background:var(--chip);width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:22px;height:22px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

/* Angebotszeilen */
.off{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:8px;margin-top:8px}
.ph{width:72px;height:72px;flex:none;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:#18202b}
.ph img{max-width:92%;max-height:92%;object-fit:contain}
.ph svg{width:70%;height:70%}
.crop{display:block;max-width:92%;max-height:92%;background-repeat:no-repeat}
.ph .pct{position:absolute;left:0;top:0;background:var(--save);color:#fff;font-size:11px;font-weight:700;padding:1px 5px;border-radius:0 0 8px 0}
.off .tx{flex:1;min-width:0}
.off .n{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.off .u{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.old{font-size:13px;color:var(--muted);text-decoration:line-through;margin-left:6px}
.add{border:0;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;flex:none}
.add svg,.qty svg{width:20px;height:20px}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--chip);border-radius:20px;flex:none}
.qty button{border:0;background:none;width:34px;height:38px;display:inline-flex;align-items:center;justify-content:center}
.qty b{min-width:18px;text-align:center}
.f1{fill:#ffd9a8}.f2{fill:#fff4d6}.f3{fill:#f4a59c}.f4{fill:#cfe3ff}

/* Viewer */
.box{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.box .bh{display:flex;align-items:center;gap:10px;color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
.box .bh span{flex:1;font-weight:600}
.box .bh .ib{background:rgba(255,255,255,.16);color:#fff}
.box .pages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.box .pages::-webkit-scrollbar{display:none}
.box .pg{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;overflow:auto}
.box .pg img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
.box .pg.zoom{align-items:flex-start;justify-content:flex-start}
.box .pg.zoom img{max-width:none;max-height:none;width:200%}
.box .bf{display:flex;justify-content:space-between;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.box .bf .ib{background:rgba(255,255,255,.16);color:#fff}
.box .hint{color:#aaa;font-size:13px;align-self:center}

/* Einkaufsliste */
.addbox{position:relative}
.addbox .search{margin-top:0;padding-right:52px}
.addbox .go{position:absolute;right:4px;top:4px;width:36px;height:36px}
.sugg{background:var(--surface);border-radius:12px;margin-top:6px;overflow:hidden}
.sugg button{display:flex;width:100%;border:0;background:none;text-align:left;padding:10px 12px;gap:10px;align-items:center;border-top:1px solid var(--line)}
.sugg button:first-child{border-top:0}
.sugg .sn{flex:1;min-width:0}
.sugg .sp{font-weight:700;white-space:nowrap}
.often{display:flex;flex-wrap:wrap;gap:6px}
.often button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.often small{font-weight:700;color:var(--save)}
.sum{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline}
.sum .tot b{font-family:var(--f-display);font-size:32px;font-weight:800}
.sum .bars{margin-top:8px;display:grid;gap:5px}
.sum .brow{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:14px}
.sum .track{height:8px;border-radius:4px;background:rgba(127,127,127,.3);overflow:hidden}
.sum .fill{display:block;height:100%;border-radius:4px}
.grp{background:var(--surface);border-radius:var(--r);margin-top:12px;overflow:hidden}
.grp .gh{display:flex;align-items:center;padding:10px 12px;font-weight:700;border-bottom:1px solid var(--line)}
.grp .gh .gn{flex:1}
.ent{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 6px;border-top:1px solid var(--line)}
.ent:first-of-type{border-top:0}
.ck{border:0;background:none;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ck i{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center}
.ck i svg{width:16px;height:16px;opacity:0}
.ent.done .ck i{background:var(--good);border-color:var(--good);color:#fff}
.ent.done .ck i svg{opacity:1}
.ent.done .en{text-decoration:line-through;color:var(--muted)}
.ent .mini{width:44px;height:44px;flex:none;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#18202b}
.ent .mini img{max-width:90%;max-height:90%}
.ent .mini svg{width:70%;height:70%}
.ent .et{flex:1;min-width:0}
.ent .en{font-weight:600;line-height:1.25}
.ent .eu{font-size:13px;color:var(--muted)}
.ent .ep{font-weight:700;white-space:nowrap}
.del{border:0;background:none;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.del svg{width:18px;height:18px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty svg{width:56px;height:56px;opacity:.5}
.tools{display:flex;gap:8px;margin-top:12px}
.tools .btn{flex:1}

/* Rezepte */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px;margin-top:4px}
.seg button{border:0;background:none;border-radius:10px;padding:8px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.rc{display:flex;gap:12px;background:var(--surface);border-radius:var(--r);padding:10px;margin-top:10px;align-items:center;border:0;width:100%;text-align:left}
.rc .ph{width:84px;height:84px}
.rc .tx{flex:1;min-width:0}
.rc h3{font-size:20px;font-weight:700;line-height:1.1}
.rc .meta{font-size:13px;color:var(--muted);margin-top:2px}
.rc .mt{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tg{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--chip)}
.tg.l{background:var(--good-bg);color:var(--good)}
.tg.a{background:var(--tag);color:var(--tag-ink)}
.tg.w{background:var(--ink);color:var(--bg)}
.heart{border:0;background:none;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.heart svg{width:24px;height:24px}
.heart[aria-pressed="true"]{color:var(--heart)}
.heart[aria-pressed="true"] path{fill:currentColor}
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px}
.rail::-webkit-scrollbar{display:none}
.rt{flex:0 0 150px;scroll-snap-align:start;background:var(--surface);border:0;border-radius:var(--r);padding:0;text-align:left;overflow:hidden}
.rt .ph{width:100%;height:100px;border-radius:0}
.rt b{display:block;padding:8px 10px 0;font-family:var(--f-display);font-size:17px;line-height:1.1}
.rt span{display:block;padding:2px 10px 10px;font-size:12.5px;color:var(--good);font-weight:700}
.rhero{display:flex;gap:14px;align-items:center;margin-top:14px}
.rhero .ph{width:96px;height:96px}
.rhero h2{font-size:28px;font-weight:800;line-height:1.05}
.zl{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);overflow:hidden}
.zl li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);min-height:52px}
.zl li:first-child{border-top:0}
.zl .zm{width:64px;flex:none;color:var(--muted);font-size:14px}
.zl .zn{flex:1;min-width:0;font-weight:600}
.zl .zs{font-size:12.5px;font-weight:700}
.zs.l{color:var(--good)}.zs.a{color:var(--save)}.zs.v{color:var(--muted);font-weight:600}
.zl .add{width:34px;height:34px}
.zl .ok{width:34px;height:34px;border-radius:50%;background:var(--good);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.zl .ok svg{width:18px;height:18px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.sheetbg{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet .big{width:100%;height:200px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#18202b;position:relative}
.sheet .big img{max-width:94%;max-height:94%;object-fit:contain}
.sheet .big svg{width:50%;height:50%}
.sheet .big .crop{max-width:94%;max-height:94%}
.sheet .big .pct{position:absolute;left:0;top:0;background:var(--save);color:#fff;font-weight:700;padding:3px 9px;border-radius:0 0 10px 0}
.sheet h2{font-size:26px;font-weight:800;line-height:1.1;margin-top:14px}
.sheet .st{display:flex;align-items:center;color:var(--muted);font-size:14px;margin-top:4px}
.sheet .pr{margin-top:10px}.sheet .pr .price{font-size:34px}
.sheet dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
.sheet dt{color:var(--muted)}
.sheet dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts .btn{flex:1;min-height:46px}
.off,.ent{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lp{transform:scale(.98);transition:transform .15s}
.hold{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:600;font-size:14px;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style>
</head>
<body>

<main id="vPros" class="wrap view">
  <header class="top"><h1>Prospekte</h1><p id="range"></p></header>
  <div class="grid" id="cards"></div>
  <p class="note" id="srcNote"></p>
</main>

<main id="vList" class="wrap view" hidden>
  <header class="top"><h1>Einkaufsliste</h1><p id="listSub"></p></header>
  <div class="addbox">
    <input id="addIn" class="search" type="text" placeholder="Artikel hinzufügen, z. B. Milch" autocomplete="off" enterkeyhint="done" aria-label="Artikel hinzufügen">
    <button class="add go" id="addGo" type="button" aria-label="Hinzufügen"></button>
  </div>
  <div class="sugg" id="sugg" hidden></div>
  <div id="oftenWrap"><h2 class="sec" id="oftenTitle">Kaufst du oft</h2><div class="often" id="often"></div></div>
  <div id="listBody"></div>
  <div id="ideasWrap" hidden><h2 class="sec">Rezeptideen zu deiner Liste</h2><div class="rail" id="ideas"></div></div>
</main>

<main id="vRez" class="wrap view" hidden>
  <header class="top"><h1>Rezepte</h1><p id="rezSub"></p></header>
  <div class="seg" role="group" aria-label="Rezepte"><button type="button" id="segS" aria-pressed="true">Vorschläge</button><button type="button" id="segG" aria-pressed="false">Gespeichert</button></div>
  <div id="rezBody"></div>
</main>

<nav class="nav" aria-label="Bereiche">
  <button type="button" data-tab="pros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/></svg>Prospekte</button>
  <button type="button" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Einkaufsliste<span class="badge" id="badge" hidden></span></button>
  <button type="button" data-tab="rez"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13a6 6 0 1 1 12 0v6H6z"/><path d="M6 16h12"/><path d="M8 7.5A3 3 0 0 1 12 4a3 3 0 0 1 4 3.5"/></svg>Rezepte</button>
</nav>

<section class="panel" id="shop" hidden aria-label="Angebote">
  <div class="phead"><div class="wrap">
    <div class="row1"><button class="ib" type="button" data-close="shop" aria-label="Zurück"></button><h2 id="shopTitle"></h2><button class="btn" type="button" id="shopPros">Prospekt</button></div>
    <input id="shopQ" class="search" type="search" placeholder="In diesem Markt suchen" aria-label="Angebote durchsuchen">
    <div class="chips" id="shopCats"></div>
  </div></div>
  <div class="wrap"><p class="note" id="shopNote"></p><div id="shopList"></div></div>
</section>

<section class="panel" id="rez" hidden aria-label="Rezept">
  <div class="phead"><div class="wrap"><div class="row1"><button class="ib" type="button" data-close="rez" aria-label="Zurück"></button><h2 id="rezTitle" style="font-size:20px"></h2><button class="heart" type="button" id="rezHeart" aria-label="Rezept speichern" aria-pressed="false"></button></div></div></div>
  <div class="wrap" id="rezDetail"></div>
</section>

<div class="box" id="box" hidden role="dialog" aria-label="Prospekt">
  <div class="bh"><span id="boxCap"></span><button class="ib" type="button" id="boxClose" aria-label="Schließen"></button></div>
  <div class="pages" id="pages"></div>
  <div class="bf"><button class="ib" type="button" id="boxPrev" aria-label="Vorherige Seite"></button><span class="hint">Wischen · Tippen zum Zoomen</span><button class="ib" type="button" id="boxNext" aria-label="Nächste Seite"></button></div>
</div>
<div class="sheetbg" id="info" hidden role="dialog" aria-label="Artikel-Details"><div class="sheet" id="infoBody"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
__RECIPES__
</script>
<script>
window.startApp=function(){
__ICONS__
  var D=window.__D, IMG=D.img||{}, PAGES=D.pages||{};
  var COLORS={"Aldi Nord":"#2a5cad","Lidl":"#f2c200","Penny":"#cd1719","REWE":"#b8001f","Netto":"#ffcc00","Norma":"#e3051b","Jawoll":"#e85d04","Krümet":"#7a1fa2"};
  var FOOD={'Fleisch & Wurst':1,'Lebensmittel':1};
  var CAT_ORDER=['Fleisch & Wurst','Lebensmittel','Getränke','Süßes','Haushalt','Deko','Mode','Pflanzen','Tier','Spielzeug'];
  var SV={
    plus:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>',
    minus:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M5 12h14"/></svg>',
    ok:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    x:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>',
    back:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>',
    next:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>',
    heart:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>',
    cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>'
  };
  function $(id){return document.getElementById(id);}
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function eur(n){return n.toFixed(2).replace('.',',')+' €';}
  function dot(st){return '<span class="dot" style="background:'+(COLORS[st]||'#888')+'"></span>';}
  function store(k,v){try{if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k,JSON.stringify(v));}catch(e){} return null;}
  function imgTag(s){
    if(!s.b) return '<img loading="lazy" decoding="async" alt="" src="'+esc(s.u)+'">';
    var b=s.b, bw=b[2]-b[0], bh=b[3]-b[1], a=bw/(bh*(s.r||1.4));
    var st='aspect-ratio:'+a.toFixed(4)+';'+(a>=1?'width:92%;':'height:92%;')+'background-image:url(\''+s.u+'\');background-size:'+(100/bw).toFixed(3)+'% '+(100/bh).toFixed(3)+'%;background-position:'+(bw<1?(b[0]/(1-bw)*100).toFixed(3):0)+'% '+(bh<1?(b[1]/(1-bh)*100).toFixed(3):0)+'%';
    return '<span class="crop" style="'+st+'"></span>';
  }
  function pic(i){ var s=i&&IMG[i.k]; return s?imgTag(s):'<svg viewBox="0 0 64 64">'+iconFor(i||{name:'',cat:''})+'</svg>'; }
  document.querySelectorAll('[data-close]').forEach(function(b){b.innerHTML=SV.back;});
  $('boxClose').innerHTML=SV.x; $('boxPrev').innerHTML=SV.back; $('boxNext').innerHTML=SV.next; $('addGo').innerHTML=SV.plus; $('rezHeart').innerHTML=SV.heart;

  var items=D.items.map(function(r){
    var pct=r[4]?Math.round((1-r[3]/r[4])*100):(r[7]||0);
    return {k:r[0]+'|'+r[1],store:r[0],name:r[1],unit:r[2],price:r[3],old:r[4],cat:r[5],note:(r[6]||'').replace(/(,\s*)?−?\d+ % lt\. Prospekt(,\s*)?/,''),pct:pct};
  });
  var BYK={}; items.forEach(function(i){BYK[i.k]=i; i.keys=FOOD[i.cat]?keysOf(i.name):[];});
  var OFFER={}; // Schlüssel -> günstigstes Lebensmittel-Angebot
  items.forEach(function(i){ i.keys.forEach(function(k){ if(!OFFER[k]||i.price<OFFER[k].price) OFFER[k]=i; }); });
  var storeNames=Object.keys(D.stores);
  var kwNum=parseInt(String(D.kw).replace(/\D/g,''),10)||0;
  $('range').textContent='KW '+kwNum+' · '+D.von.slice(0,6)+'–'+D.bis+' · Stand '+D.stand+(window.__OFF?' · offline':'');
  $('srcNote').textContent='Angebote ohne Gewähr – Preise und Gültigkeit können je Filiale abweichen. Nächste Aktualisierung: '+(D.naechstes||'Freitag')+'.';

  // ---------- Toast ----------
  var toastT; function toast(t){ var el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){el.hidden=true;},1800); }

  // ---------- Prospekt-Karten ----------
  $('cards').innerHTML=storeNames.map(function(st){
    var L=PAGES[st]||[], n=items.filter(function(i){return i.store===st;}).length, s=D.stores[st];
    return '<div class="card"><button class="cv" type="button" data-pros="'+esc(st)+'" aria-label="'+esc(st)+' Prospekt öffnen"'+(L.length?'':' disabled style="background:'+(COLORS[st]||'#888')+'"')+'>'+
      (L.length?'<img decoding="async" loading="lazy" alt="" src="'+esc(L[0])+'"><span class="pg">'+L.length+' Seiten</span>':'<span class="np">'+esc(st)+'</span>')+'</button>'+
      '<div class="bar" style="background:'+(COLORS[st]||'#888')+'"></div>'+
      '<div class="nm">'+esc(st)+'</div><div class="gl">'+esc(s.gilt)+'</div>'+
      '<div class="bt"><button class="btn pri" type="button" data-pros="'+esc(st)+'"'+(L.length?'':' disabled')+'>Prospekt ansehen</button><button class="btn" type="button" data-shop="'+esc(st)+'"'+(n?'':' disabled')+'>'+n+' Angebote</button></div></div>';
  }).join('');

  // ---------- Viewer ----------
  var box=$('box'), pagesEl=$('pages'), cur={s:'',i:0,L:[]}, scrollT=null;
  function loadAround(i){ for(var j=i-1;j<=i+2;j++){ var pg=pagesEl.children[j]; if(pg){ var im=pg.firstChild; if(!im.getAttribute('src')) im.setAttribute('src',cur.L[j]); } } }
  function setCur(i){ cur.i=i; $('boxCap').textContent=cur.s+' · Seite '+(i+1)+' von '+cur.L.length; loadAround(i); }
  function openPros(st){
    var L=PAGES[st]||[]; if(!L.length) return; cur={s:st,i:0,L:L};
    pagesEl.innerHTML=L.map(function(k,j){return '<div class="pg"><img alt="'+esc(st)+' Seite '+(j+1)+'" decoding="async"></div>';}).join('');
    box.hidden=false; pagesEl.scrollLeft=0; setCur(0);
  }
  function closeBox(){ box.hidden=true; pagesEl.innerHTML=''; }
  function step(d){ var n=Math.max(0,Math.min(cur.L.length-1,cur.i+d)); pagesEl.scrollTo({left:n*pagesEl.clientWidth,behavior:'smooth'}); }
  pagesEl.addEventListener('scroll',function(){ clearTimeout(scrollT); scrollT=setTimeout(function(){ var i=Math.round(pagesEl.scrollLeft/Math.max(1,pagesEl.clientWidth)); if(i!==cur.i) setCur(i); },80); });
  pagesEl.addEventListener('click',function(e){ var pg=e.target.closest('.pg'); if(pg) pg.classList.toggle('zoom'); });
  $('boxClose').addEventListener('click',closeBox); $('boxPrev').addEventListener('click',function(){step(-1);}); $('boxNext').addEventListener('click',function(){step(1);});

  // ---------- Einkaufsliste (Format kompatibel zu v3) ----------
  function sanitize(o){ var en=Array.isArray(o&&o.entries)?o.entries:[]; return {entries:en.filter(function(e){return e&&(typeof e.free==='string'||(typeof e.k==='string'&&e.snap&&typeof e.snap.price==='number'));}).map(function(e){ return e.free!=null?{free:String(e.free).slice(0,80),done:!!e.done}:{k:e.k,q:Math.max(1,Math.min(99,+e.q||1)),done:!!e.done,snap:{store:String(e.snap.store),name:String(e.snap.name),unit:String(e.snap.unit||''),price:+e.snap.price,old:e.snap.old==null?null:+e.snap.old}}; })}; }
  var LIST=sanitize(store('einkaufsliste'));
  function find(k){for(var j=0;j<LIST.entries.length;j++) if(LIST.entries[j].k===k) return LIST.entries[j]; return null;}
  function qtyOf(k){var e=find(k); return e?e.q:0;}
  function entryName(e){return e.free!=null?e.free:e.snap.name;}

  // Kaufhistorie: {name:{n,last,k?,keys}}
  var HIST=store('kaufhistorie')||{};
  if(!store('kaufhistorie-init')){ LIST.entries.forEach(function(e){ remember(e,true); }); store('kaufhistorie-init',1); store('kaufhistorie',HIST); }
  function remember(e,silent){
    var nm=entryName(e).trim(); if(!nm) return; var key=nm.toLowerCase();
    var h=HIST[key]||{label:nm,n:0,last:0,keys:keysOf(nm)};
    if(Date.now()-h.last>6*3600e3||!h.n) h.n++;  // mehrfaches Hinzufügen am selben Tag zählt einmal
    h.last=Date.now(); h.label=nm; if(e.k) h.k=e.k;
    HIST[key]=h; if(!silent) store('kaufhistorie',HIST);
  }
  function save(){ store('einkaufsliste',LIST); paintBadge(); }
  function addOffer(k,silent){
    var i=BYK[k]; if(!i) return; var e=find(k);
    if(e){ e.q=Math.min(99,e.q+1); e.done=false; }
    else { e={k:k,q:1,done:false,snap:{store:i.store,name:i.name,unit:i.unit,price:i.price,old:i.old}}; LIST.entries.push(e); remember(e); }
    save(); if(!silent) toast(i.name.slice(0,40)+' · '+i.store+' – auf der Liste');
  }
  function addFree(t,silent){
    t=String(t).trim().slice(0,80); if(!t) return;
    var low=t.toLowerCase(); for(var j=0;j<LIST.entries.length;j++){ var x=LIST.entries[j]; if(x.free!=null&&x.free.toLowerCase()===low){ x.done=false; save(); return; } }
    var e={free:t,done:false}; LIST.entries.push(e); remember(e); save(); if(!silent) toast(t+' – auf der Liste');
  }
  function setQty(k,q){ var e=find(k); if(!e) return; if(q<=0) LIST.entries.splice(LIST.entries.indexOf(e),1); else e.q=Math.min(99,q); save(); }
  function listKeys(){ var s={}; LIST.entries.forEach(function(e){ keysOf(entryName(e)).forEach(function(k){s[k]=1;}); }); return s; }
  function regularKeys(){ var s={}; Object.keys(HIST).forEach(function(n){ var h=HIST[n]; (h.keys||[]).forEach(function(k){ s[k]=(s[k]||0)+h.n; }); }); Object.keys(s).forEach(function(k){ if(s[k]<2) delete s[k]; }); return s; }
  function paintBadge(){ var n=LIST.entries.filter(function(e){return !e.done;}).length; var b=$('badge'); b.hidden=!n; b.textContent=n; }

  function miniOf(e){ var i=e.k?BYK[e.k]:null; if(i&&IMG[i.k]) return '<div class="mini">'+imgTag(IMG[i.k])+'</div>'; return '<div class="mini"><svg viewBox="0 0 64 64">'+iconFor(i||{name:entryName(e),cat:e.free!=null?'':'Lebensmittel'})+'</svg></div>'; }
  var confirmClear=false;
  function renderList(){
    var open=LIST.entries.filter(function(e){return !e.done;}).length, tot=LIST.entries.length;
    $('listSub').textContent=tot?(open+' offen'+(tot>open?' · '+(tot-open)+' erledigt':'')):'Noch leer';
    renderOften();
    var body=$('listBody');
    if(!tot){ body.innerHTML='<div class="empty">'+SV.cart+'<p>Tippe oben einen Artikel ein oder füge Angebote aus den Prospekten mit <b>+</b> hinzu.</p></div>'; renderIdeas(); return; }
    var groups={}, order=[];
    LIST.entries.forEach(function(e,idx){ var g=e.free!=null?'Sonstiges':e.snap.store; if(!groups[g]){groups[g]={sum:0,list:[]}; order.push(g);} groups[g].list.push(idx); if(e.free==null) groups[g].sum+=e.snap.price*e.q; });
    order.sort(function(a,b){ if(a==='Sonstiges') return 1; if(b==='Sonstiges') return -1; return storeNames.indexOf(a)-storeNames.indexOf(b); });
    var sum=0, priced=order.filter(function(g){return g!=='Sonstiges';}); priced.forEach(function(g){sum+=groups[g].sum;});
    var max=Math.max.apply(null,priced.map(function(g){return groups[g].sum;}).concat([0.01]));
    var h='';
    if(priced.length) h+='<div class="sum"><div class="tot"><span>Voraussichtlich</span><b>'+eur(sum)+'</b></div><div class="bars">'+priced.map(function(g){return '<div class="brow"><span>'+dot(g)+esc(g)+'</span><span class="track"><span class="fill" style="width:'+Math.max(4,Math.round(groups[g].sum/max*100))+'%;background:'+(COLORS[g]||'#888')+'"></span></span><b>'+eur(groups[g].sum)+'</b></div>';}).join('')+'</div></div>';
    order.forEach(function(g){
      var G=groups[g], idxs=G.list.slice().sort(function(a,b){return (LIST.entries[a].done?1:0)-(LIST.entries[b].done?1:0);});
      h+='<div class="grp"><div class="gh">'+(g==='Sonstiges'?'':dot(g))+'<span class="gn">'+esc(g)+'</span>'+(g==='Sonstiges'?'':'<b>'+eur(G.sum)+'</b>')+'</div>';
      idxs.forEach(function(idx){ var e=LIST.entries[idx];
        h+='<div class="ent'+(e.done?' done':'')+'" data-einfo="'+idx+'"><button class="ck" type="button" data-ck="'+idx+'" aria-label="Abhaken" aria-pressed="'+e.done+'"><i>'+SV.ok+'</i></button>'+miniOf(e)+
          '<div class="et"><div class="en">'+esc(entryName(e))+'</div>'+(e.free==null?'<div class="eu">'+esc(e.snap.unit)+(e.q>1?' · '+e.q+' × '+eur(e.snap.price):'')+'</div>':'')+'</div>'+
          (e.free==null?'<span class="qty"><button type="button" data-q="'+idx+'" data-d="-1" aria-label="Weniger">'+SV.minus+'</button><b>'+e.q+'</b><button type="button" data-q="'+idx+'" data-d="1" aria-label="Mehr">'+SV.plus+'</button></span>':'')+
          '<button class="del" type="button" data-del="'+idx+'" aria-label="Löschen">'+SV.x+'</button></div>';
      });
      h+='</div>';
    });
    h+='<div class="tools"><button class="btn" type="button" id="clrDone"'+(tot>open?'':' disabled')+'>Erledigte entfernen</button><button class="btn" type="button" id="clrAll">'+(confirmClear?'Wirklich leeren?':'Liste leeren')+'</button></div>';
    body.innerHTML=h; renderIdeas();
  }
  $('listBody').addEventListener('click',function(ev){
    var t=ev.target.closest('button'); if(!t) return;
    if(t.dataset.ck!=null){ var e=LIST.entries[+t.dataset.ck]; e.done=!e.done; save(); renderList(); }
    else if(t.dataset.q!=null){ var e2=LIST.entries[+t.dataset.q]; var q=e2.q+(+t.dataset.d); if(q<=0) LIST.entries.splice(+t.dataset.q,1); else e2.q=Math.min(99,q); save(); renderList(); }
    else if(t.dataset.del!=null){ LIST.entries.splice(+t.dataset.del,1); save(); renderList(); }
    else if(t.id==='clrDone'){ LIST.entries=LIST.entries.filter(function(e){return !e.done;}); save(); renderList(); }
    else if(t.id==='clrAll'){ if(!confirmClear){ confirmClear=true; renderList(); setTimeout(function(){ if(confirmClear){confirmClear=false; if(tab==='list') renderList();} },3000); } else { confirmClear=false; LIST.entries=[]; save(); renderList(); } }
  });

  // Kaufst du oft
  function histList(){
    var onList={}; LIST.entries.forEach(function(e){ onList[entryName(e).toLowerCase()]=1; });
    return Object.keys(HIST).filter(function(n){return !onList[n];}).map(function(n){return HIST[n];}).sort(function(a,b){return b.n-a.n||b.last-a.last;});
  }
  function histOffer(h){
    for(var j=0;j<items.length;j++) if(items[j].name.toLowerCase()===h.label.toLowerCase()) return items[j];
    for(var k=0;k<(h.keys||[]).length;k++) if(OFFER[h.keys[k]]) return OFFER[h.keys[k]];
    return null;
  }
  var oftenData=[];
  function renderOften(){
    var L=histList(); oftenData=L.slice(0,12);
    $('oftenWrap').hidden=!oftenData.length;
    $('oftenTitle').textContent=oftenData.some(function(h){return h.n>=2;})?'Kaufst du oft':'Zuletzt auf der Liste';
    $('often').innerHTML=oftenData.map(function(h,j){ var o=histOffer(h); return '<button type="button" data-of="'+j+'">'+SV.plus.replace('<svg','<svg width="14" height="14"')+esc(h.label.length>28?h.label.slice(0,27)+'…':h.label)+(o?' <small>'+esc(o.store)+' '+eur(o.price)+'</small>':'')+'</button>'; }).join('');
  }
  $('often').addEventListener('click',function(ev){ var t=ev.target.closest('[data-of]'); if(!t) return; var h=oftenData[+t.dataset.of]; var o=histOffer(h); if(o) addOffer(o.k); else addFree(h.label); renderList(); });

  // Hinzufügen mit Vorschlägen
  var addIn=$('addIn'), suggEl=$('sugg'), suggData=[];
  function renderSugg(){
    var q=addIn.value.trim().toLowerCase(); if(q.length<2){ suggEl.hidden=true; return; }
    var off=items.filter(function(i){return (i.name+' '+i.cat).toLowerCase().indexOf(q)>-1;}).sort(function(a,b){return a.price-b.price;}).slice(0,6);
    suggData=off.map(function(i){return {o:i};}); suggData.push({free:addIn.value.trim()});
    suggEl.innerHTML=suggData.map(function(s,j){ if(s.free) return '<button type="button" data-sg="'+j+'">'+SV.plus.replace('<svg','<svg width="18" height="18"')+'<span class="sn">„'+esc(s.free)+'“ als eigenen Eintrag</span></button>';
      var i=s.o; return '<button type="button" data-sg="'+j+'">'+dot(i.store)+'<span class="sn">'+esc(i.name)+' <span class="muted">· '+esc(i.store)+'</span></span><span class="sp">'+eur(i.price)+'</span></button>'; }).join('');
    suggEl.hidden=false;
  }
  addIn.addEventListener('input',renderSugg);
  addIn.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); if(addIn.value.trim()){ addFree(addIn.value); addIn.value=''; suggEl.hidden=true; renderList(); } } });
  $('addGo').addEventListener('click',function(){ if(addIn.value.trim()){ addFree(addIn.value); addIn.value=''; suggEl.hidden=true; renderList(); } else addIn.focus(); });
  suggEl.addEventListener('click',function(ev){ var t=ev.target.closest('[data-sg]'); if(!t) return; var s=suggData[+t.dataset.sg]; if(s.free) addFree(s.free); else addOffer(s.o.k); addIn.value=''; suggEl.hidden=true; renderList(); });

  // ---------- Markt-Angebote ----------
  var shopSt='', shopCat='', shop=$('shop');
  function openShop(st){ shopSt=st; shopCat=''; $('shopQ').value=''; $('shopTitle').innerHTML=dot(st)+esc(st); $('shopPros').disabled=!(PAGES[st]||[]).length; var s=D.stores[st]; $('shopNote').textContent='Gültig '+s.gilt+(s.hinweis?' · '+s.hinweis:''); shop.hidden=false; shop.scrollTop=0; renderShop(); }
  function offRow(i){
    var q=qtyOf(i.k);
    return '<div class="off" data-info="'+esc(i.k)+'"><div class="ph">'+pic(i)+(i.pct>=10?'<span class="pct">−'+i.pct+'%</span>':'')+'</div><div class="tx"><div class="n">'+esc(i.name)+'</div><div class="u">'+esc(i.unit)+(i.note?' · '+esc(i.note):'')+'</div><div><span class="price">'+eur(i.price)+'</span>'+(i.old?'<span class="old">'+eur(i.old)+'</span>':'')+'</div></div>'+
      (q?'<span class="qty"><button type="button" data-k="'+esc(i.k)+'" data-d="-1" aria-label="Weniger">'+SV.minus+'</button><b>'+q+'</b><button type="button" data-k="'+esc(i.k)+'" data-d="1" aria-label="Mehr">'+SV.plus+'</button></span>':'<button class="add" type="button" data-k="'+esc(i.k)+'" data-d="1" aria-label="Auf die Einkaufsliste">'+SV.plus+'</button>')+'</div>';
  }
  function renderShop(){
    var all=items.filter(function(i){return i.store===shopSt;});
    var cats=CAT_ORDER.filter(function(c){return all.some(function(i){return i.cat===c;});});
    $('shopCats').innerHTML=['Alle'].concat(cats).map(function(c){ var v=c==='Alle'?'':c; return '<button class="chip" type="button" data-cat="'+esc(v)+'" aria-pressed="'+(shopCat===v)+'">'+esc(c)+'</button>'; }).join('');
    var q=$('shopQ').value.trim().toLowerCase();
    var L=all.filter(function(i){return (!shopCat||i.cat===shopCat)&&(!q||i.name.toLowerCase().indexOf(q)>-1);});
    L.sort(function(a,b){ return (shopCat?0:CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat))||b.pct-a.pct||a.price-b.price; });
    $('shopList').innerHTML=L.length?L.map(offRow).join('')+'<p class="hold">Lange drücken für alle Infos zum Artikel</p>':'<p class="empty">Keine Treffer.</p>';
  }
  $('shopCats').addEventListener('click',function(e){ var t=e.target.closest('[data-cat]'); if(!t) return; shopCat=t.dataset.cat; renderShop(); });
  $('shopQ').addEventListener('input',renderShop);
  $('shopList').addEventListener('click',function(e){ var t=e.target.closest('[data-k]'); if(!t) return; var k=t.dataset.k; if(+t.dataset.d>0) addOffer(k,qtyOf(k)>0); else setQty(k,qtyOf(k)-1); renderShop(); });
  $('shopPros').addEventListener('click',function(){ openPros(shopSt); });

  // ---------- Rezepte ----------
  var SAVED=store('rezepte-gespeichert')||[];
  var POOL=RECIPES.slice(); (D.rezepte||[]).forEach(function(r){ if(r&&r.id&&r.t&&r.i&&r.s){ r.wk=true; POOL=POOL.filter(function(x){return x.id!==r.id;}); POOL.unshift(r); } });
  function byId(id){ for(var j=0;j<POOL.length;j++) if(POOL[j].id===id) return POOL[j]; for(var m=0;m<SAVED.length;m++) if(SAVED[m].id===id) return SAVED[m]; return null; }
  function isSaved(id){ return SAVED.some(function(r){return r.id===id;}); }
  function toggleSave(id){ if(isSaved(id)){ SAVED=SAVED.filter(function(r){return r.id!==id;}); toast('Aus Gespeichert entfernt'); } else { var r=byId(id); if(r){ SAVED.unshift(JSON.parse(JSON.stringify(r))); toast('Rezept gespeichert'); } } store('rezepte-gespeichert',SAVED); }
  function seed(s){ var h=2166136261; for(var j=0;j<s.length;j++){ h^=s.charCodeAt(j); h=Math.imul(h,16777619); } return ((h>>>0)%1000)/1000; }
  function analyse(r,LK,RK){
    var keyed=r.i.filter(function(z){return z[2];}), l=0,a=0,g=0;
    keyed.forEach(function(z){ if(LK[z[2]]) l++; else if(OFFER[z[2]]) a++; if(RK[z[2]]) g++; });
    return {n:keyed.length,l:l,a:a,g:g};
  }
  function score(r,LK,RK){ var x=analyse(r,LK,RK); return (x.l*3+x.g*1+x.a*0.5)/Math.max(3,x.n)*3 + (r.wk?1:0) + seed(r.id+'|'+kwNum)*1.2; }
  function suggestions(n){ var LK=listKeys(), RK=regularKeys(); return POOL.map(function(r){return {r:r,s:score(r,LK,RK)};}).sort(function(a,b){return b.s-a.s;}).slice(0,n).map(function(x){return x.r;}); }
  function rPic(r){ var ks=[r.h].concat(r.i.map(function(z){return z[2];})); for(var j=0;j<ks.length;j++){ var o=ks[j]&&OFFER[ks[j]]; if(o&&IMG[o.k]) return imgTag(IMG[o.k]); } return '<svg viewBox="0 0 64 64">'+iconFor({name:KEYNAME[r.h]||r.t,cat:'Lebensmittel'})+'</svg>'; }
  function tags(r,x){ var t=''; if(r.wk) t+='<span class="tg w">Diese Woche</span>'; if(x.l) t+='<span class="tg l">✓ '+x.l+' auf der Liste</span>'; if(x.a) t+='<span class="tg a">'+x.a+' im Angebot</span>'; if(!x.l&&x.g) t+='<span class="tg">'+x.g+' kaufst du oft</span>'; return t; }
  function rCard(r,LK,RK){ var x=analyse(r,LK,RK); return '<div class="rc"><button type="button" class="ph" data-r="'+esc(r.id)+'" style="border:0;padding:0" aria-label="'+esc(r.t)+' öffnen">'+rPic(r)+'</button><button type="button" class="tx" data-r="'+esc(r.id)+'" style="border:0;background:none;text-align:left;padding:0"><h3>'+esc(r.t)+'</h3><div class="meta">'+r.z+' Min · '+r.p+' Portionen · '+x.n+' Zutaten</div><div class="mt">'+tags(r,x)+'</div></button><button class="heart" type="button" data-h="'+esc(r.id)+'" aria-label="Speichern" aria-pressed="'+isSaved(r.id)+'">'+SV.heart+'</button></div>'; }
  var rezMode='s';
  function renderRez(){
    var LK=listKeys(), RK=regularKeys();
    $('segS').setAttribute('aria-pressed',rezMode==='s'); $('segG').setAttribute('aria-pressed',rezMode==='g');
    $('segG').textContent='Gespeichert'+(SAVED.length?' ('+SAVED.length+')':'');
    if(rezMode==='s'){
      $('rezSub').textContent='Passend zu deiner Liste, deinen Stammartikeln und den Angeboten der KW '+kwNum;
      $('rezBody').innerHTML=suggestions(12).map(function(r){return rCard(r,LK,RK);}).join('');
    } else {
      $('rezSub').textContent=SAVED.length?SAVED.length+' gespeicherte Rezepte':'Tippe auf das Herz, um ein Rezept zu speichern';
      $('rezBody').innerHTML=SAVED.length?SAVED.map(function(r){return rCard(r,LK,RK);}).join(''):'<div class="empty">'+SV.heart.replace('<svg','<svg style="width:56px;height:56px"')+'<p>Noch keine gespeicherten Rezepte.</p></div>';
    }
  }
  $('segS').addEventListener('click',function(){rezMode='s';renderRez();}); $('segG').addEventListener('click',function(){rezMode='g';renderRez();});
  function renderIdeas(){
    var LK=listKeys(); if(!Object.keys(LK).length){ $('ideasWrap').hidden=true; return; }
    var RK=regularKeys(), L=suggestions(8).filter(function(r){return analyse(r,LK,RK).l>0;}).slice(0,6);
    $('ideasWrap').hidden=!L.length;
    $('ideas').innerHTML=L.map(function(r){ var x=analyse(r,LK,RK); return '<button class="rt" type="button" data-r="'+esc(r.id)+'"><div class="ph">'+rPic(r)+'</div><b>'+esc(r.t)+'</b><span>✓ '+x.l+' von '+x.n+' Zutaten da</span></button>'; }).join('');
  }
  // Rezept-Detail
  var rezEl=$('rez'), curR=null;
  function openRez(id){ var r=byId(id); if(!r) return; curR=r; rezEl.hidden=false; rezEl.scrollTop=0; renderRezDetail(); }
  function missing(r){ var LK=listKeys(); return r.i.filter(function(z){return z[2]&&!LK[z[2]];}); }
  function renderRezDetail(){
    var r=curR, LK=listKeys();
    $('rezTitle').textContent=r.t; $('rezHeart').setAttribute('aria-pressed',isSaved(r.id));
    var miss=missing(r);
    var h='<div class="rhero"><div class="ph">'+rPic(r)+'</div><div><h2>'+esc(r.t)+'</h2><div class="muted">'+r.z+' Min · '+r.p+' Portionen</div></div></div>';
    h+='<h2 class="sec">Zutaten</h2><ul class="zl">'+r.i.map(function(z,j){
      var k=z[2], st, act='';
      if(!k){ st='<span class="zs v">Vorrat</span>'; }
      else if(LK[k]){ st='<span class="zs l">auf der Liste</span>'; act='<span class="ok">'+SV.ok+'</span>'; }
      else if(OFFER[k]){ var o=OFFER[k]; st='<span class="zs a">'+esc(o.store)+' '+eur(o.price)+' · '+esc(o.name.length>30?o.name.slice(0,29)+'…':o.name)+'</span>'; act='<button class="add" type="button" data-z="'+j+'" aria-label="'+esc(z[1])+' auf die Liste">'+SV.plus+'</button>'; }
      else { st='<span class="zs v">fehlt</span>'; act='<button class="add" type="button" data-z="'+j+'" aria-label="'+esc(z[1])+' auf die Liste">'+SV.plus+'</button>'; }
      return '<li><span class="zm">'+esc(z[0])+'</span><span class="zn">'+esc(z[1])+'<br>'+st+'</span>'+act+'</li>';
    }).join('')+'</ul>';
    h+='<div style="margin-top:12px"><button class="btn pri wide" type="button" id="addMiss"'+(miss.length?'':' disabled')+'>'+(miss.length?'Fehlende Zutaten auf die Liste ('+miss.length+')':'Alles auf der Liste')+'</button></div>';
    h+='<h2 class="sec">Zubereitung</h2><ol class="steps">'+r.s.map(function(s){return '<li><span>'+esc(s)+'</span></li>';}).join('')+'</ol>';
    $('rezDetail').innerHTML=h;
  }
  function addIng(z){ var o=OFFER[z[2]]; if(o) addOffer(o.k,true); else addFree(KEYNAME[z[2]]||z[1],true); }
  $('rezDetail').addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t) return;
    if(t.dataset.z!=null){ var z=curR.i[+t.dataset.z]; addIng(z); toast(z[1]+' – auf der Liste'); renderRezDetail(); }
    else if(t.id==='addMiss'){ var m=missing(curR); m.forEach(addIng); toast(m.length+' Zutaten auf die Liste'); renderRezDetail(); }
  });
  $('rezHeart').addEventListener('click',function(){ toggleSave(curR.id); renderRezDetail(); if(tab==='rez') renderRez(); });
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-r],[data-h],[data-pros],[data-shop],[data-close],[data-tab]'); if(!t) return;
    if(t.dataset.r) openRez(t.dataset.r);
    else if(t.dataset.h){ toggleSave(t.dataset.h); renderRez(); }
    else if(t.dataset.pros) openPros(t.dataset.pros);
    else if(t.dataset.shop) openShop(t.dataset.shop);
    else if(t.dataset.close){ closePanel(t.dataset.close); }
    else if(t.dataset.tab) setTab(t.dataset.tab);
  });
  function closePanel(id){ $(id).hidden=true; if(id==='rez'&&tab==='list') renderList(); if(id==='rez'&&tab==='rez') renderRez(); }

  // ---------- Details per langem Druck ----------
  var infoEl=$('info'), infoK=null;
  function openInfo(i,e){
    infoK=i?i.k:null;
    var nm=i?i.name:entryName(e), st=i?i.store:(e&&e.snap?e.snap.store:''), pct=i?i.pct:0;
    var unit=i?i.unit:(e&&e.snap?e.snap.unit:''), price=i?i.price:(e&&e.snap?e.snap.price:null), old=i?i.old:(e&&e.snap?e.snap.old:null);
    var h='<div class="grab"></div><div class="big">'+(i?pic(i):'<svg viewBox="0 0 64 64">'+iconFor({name:nm,cat:''})+'</svg>')+(pct>=1?'<span class="pct">−'+pct+'%</span>':'')+'</div>';
    h+='<h2>'+esc(nm)+'</h2>'+(st?'<div class="st">'+dot(st)+esc(st)+(i?' · '+esc(i.cat):'')+'</div>':'');
    if(price!=null) h+='<div class="pr"><span class="price">'+eur(price)+'</span>'+(old?'<span class="old">'+eur(old)+'</span>':'')+(old?' <span class="tg a">'+eur(old-price)+' gespart</span>':'')+'</div>';
    var rows=[];
    if(unit) rows.push(['Menge',unit]);
    if(i&&i.note) i.note.split(/;\s*/).forEach(function(x,j){ if(x.trim()) rows.push([j?'':'Hinweise',x.trim()]); });
    if(st&&D.stores[st]){ rows.push(['Gültig',D.stores[st].gilt]); if(D.stores[st].hinweis) rows.push(['Markt',D.stores[st].hinweis]); }
    if(!i&&e&&e.k) rows.push(['','Dieses Angebot ist nicht mehr in den aktuellen Prospekten.']);
    if(rows.length) h+='<dl>'+rows.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>';}).join('')+'</dl>';
    var q=i?qtyOf(i.k):0;
    h+='<div class="acts">'+(i?'<button class="btn pri" type="button" id="infoAdd">'+(q?'Noch eins auf die Liste ('+q+')':'Auf die Einkaufsliste')+'</button>':'')+((i&&(PAGES[i.store]||[]).length)?'<button class="btn" type="button" id="infoPros">Prospekt</button>':'')+'<button class="btn" type="button" id="infoClose">Schließen</button></div>';
    $('infoBody').innerHTML=h; infoEl.hidden=false;
  }
  infoEl.addEventListener('click',function(ev){
    if(ev.target===infoEl||ev.target.id==='infoClose'){ infoEl.hidden=true; return; }
    if(ev.target.id==='infoAdd'){ addOffer(infoK); infoEl.hidden=true; if(!shop.hidden) renderShop(); if(tab==='list') renderList(); }
    if(ev.target.id==='infoPros'){ var s=BYK[infoK].store; infoEl.hidden=true; openPros(s); }
  });
  (function(){
    var timer=null, sx=0, sy=0, fired=false, row=null;
    function cancel(){ clearTimeout(timer); timer=null; if(row) row.classList.remove('lp'); row=null; }
    document.addEventListener('pointerdown',function(ev){
      var r=ev.target.closest('[data-info],[data-einfo]'); if(!r) return;
      fired=false; sx=ev.clientX; sy=ev.clientY; row=r; r.classList.add('lp');
      timer=setTimeout(function(){
        fired=true; var rr=row; cancel();
        if(navigator.vibrate) try{navigator.vibrate(20);}catch(e){}
        if(rr.dataset.info) openInfo(BYK[rr.dataset.info]);
        else { var e=LIST.entries[+rr.dataset.einfo]; if(e) openInfo(e.k?BYK[e.k]:null,e); }
      },450);
    },{passive:true});
    document.addEventListener('pointermove',function(ev){ if(timer&&(Math.abs(ev.clientX-sx)>10||Math.abs(ev.clientY-sy)>10)) cancel(); },{passive:true});
    document.addEventListener('pointerup',cancel); document.addEventListener('pointercancel',cancel);
    document.addEventListener('click',function(ev){ if(fired){ fired=false; ev.stopPropagation(); ev.preventDefault(); } },true);
    document.addEventListener('contextmenu',function(ev){ if(ev.target.closest('[data-info],[data-einfo]')) ev.preventDefault(); });
  })();

  // ---------- Tabs ----------
  var tab='pros', VIEWS={pros:'vPros',list:'vList',rez:'vRez'};
  function setTab(t){
    if(!VIEWS[t]) t='pros'; tab=t;
    Object.keys(VIEWS).forEach(function(k){ $(VIEWS[k]).hidden=k!==t; });
    document.querySelectorAll('.nav [data-tab]').forEach(function(b){ if(b.dataset.tab===t) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    shop.hidden=true; rezEl.hidden=true; suggEl.hidden=true; infoEl.hidden=true;
    if(t==='list') renderList(); if(t==='rez') renderRez();
    window.scrollTo(0,0); store('app-tab',t);
  }
  window.appBack=function(){
    if(!infoEl.hidden){ infoEl.hidden=true; return 1; }
    if(!box.hidden){ closeBox(); return 1; }
    if(!rezEl.hidden){ closePanel('rez'); return 1; }
    if(!shop.hidden){ shop.hidden=true; return 1; }
    if(tab!=='pros'){ setTab('pros'); return 1; }
    return 0;
  };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') window.appBack(); if(!box.hidden){ if(e.key==='ArrowRight') step(1); if(e.key==='ArrowLeft') step(-1); } });
  window.addEventListener('storage',function(e){ if(e.key==='einkaufsliste'){ LIST=sanitize(store('einkaufsliste')); paintBadge(); if(tab==='list') renderList(); } });
  paintBadge(); setTab(store('app-tab')||'pros');
};
</script>
<script>
(function(){
  var URL='https://raw.githubusercontent.com/ritzrowcinema-cloud/angebote-luebeck/main/data.json';
  var EMB=__EMB__;
  var cached=null; try{cached=JSON.parse(localStorage.getItem('angebote-data')||'null');}catch(e){}
  var best=(cached&&cached.items&&cached.ts>EMB.ts)?cached:EMB, done=false;
  function go(d,off){ if(done) return; done=true; window.__D=d; window.__OFF=off; window.startApp(); }
  var ctl=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){ if(ctl) ctl.abort(); go(best,true); },8000);
  fetch(URL+'?t='+Math.floor(Date.now()/300000),{cache:'no-store',signal:ctl?ctl.signal:undefined})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ clearTimeout(to); if(!d||!d.items) throw new Error('bad'); if(!d.ts||d.ts>=best.ts){ try{localStorage.setItem('angebote-data',JSON.stringify(d));}catch(e){} go(d,false);} else go(best,false); })
    .catch(function(){ clearTimeout(to); go(best,true); });
})();
</script>
</body>
